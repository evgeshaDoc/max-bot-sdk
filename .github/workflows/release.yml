name: Protected release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable package version from package.json
        required: true

permissions:
  contents: read

jobs:
  approval-policy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Verify release approval policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/max-sdk-release" --jq '.protection_rules' > rules.json
          jq -e 'any(.[]; .type == "required_reviewers" and (.reviewers | length > 0))' rules.json
  release:
    needs: approval-policy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    environment: max-sdk-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18.18.2
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate requested version
        run: |
          node <<'NODE'
          const version = process.env.RELEASE_VERSION;
          const exactVersion = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (!exactVersion.test(version) || version !== require('./package.json').version) {
            throw new Error('Release version must be the exact package.json version');
          }
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:examples
      - run: npm test
      - run: npm run test:pack
      - name: Verify annotated immutable version tag
        run: |
          git fetch --tags --force
          test "$(git cat-file -t "refs/tags/v$RELEASE_VERSION")" = tag
          test "$(git rev-list -n 1 "refs/tags/v$RELEASE_VERSION")" = "$GITHUB_SHA"
          versions="$(npm view @tlman/max-bot-sdk versions --json 2>/dev/null || printf '[]')"
          node -e "const versions=JSON.parse(process.argv[1]); if ([versions].flat().includes(process.argv[2])) process.exit(1)" "$versions" "$RELEASE_VERSION"
      - name: Pack candidate
        id: pack
        run: |
          npm pack --json --silent > pack.json
          echo "tarball=$(node -p "require('./pack.json')[0].filename")" >> "$GITHUB_OUTPUT"
          mkdir live-candidate
          npm install --prefix live-candidate --ignore-scripts --no-audit --no-fund "./$(node -p "require('./pack.json')[0].filename")"
      - name: Live webhook gate
        env:
          LIVE_PACKAGE_ROOT: ${{ github.workspace }}/live-candidate
          MAX_TEST_BOT_TOKEN: ${{ secrets.MAX_TEST_BOT_TOKEN }}
          MAX_TEST_WEBHOOK_BASE_URL: ${{ secrets.MAX_TEST_WEBHOOK_BASE_URL }}
          MAX_TEST_RECEIVER_CONTROL_URL: ${{ secrets.MAX_TEST_RECEIVER_CONTROL_URL }}
          MAX_TEST_RECEIVER_CONTROL_TOKEN: ${{ secrets.MAX_TEST_RECEIVER_CONTROL_TOKEN }}
        run: node test/live-webhook-gate.mjs
      - name: Preserve redacted live evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-webhook-evidence-${{ inputs.version }}
          path: live-evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Record release identity
        run: |
          node <<'NODE'
          const env = process.env;
          require('node:fs').writeFileSync('release-metadata.json', JSON.stringify({
            package: '@tlman/max-bot-sdk', version: env.RELEASE_VERSION, forkSha: env.GITHUB_SHA,
            upstreamSha: '2e4263e359b161830f1fd636400482ed4aede13b', docsAuditDate: '2026-08-13',
            integrity: require('./pack.json')[0].integrity,
            liveEvidenceArtifact: `live-webhook-evidence-${env.RELEASE_VERSION}`,
            workflowRun: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`,
          }));
          NODE
      - name: Publish exact candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --provenance
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release create "v$RELEASE_VERSION" "$TARBALL" release-metadata.json --generate-notes --verify-tag
      - name: Alert on failed release or cleanup
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Release gate failed for $RELEASE_VERSION" --body "Protected release run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed. Verify webhook cleanup before retrying."
